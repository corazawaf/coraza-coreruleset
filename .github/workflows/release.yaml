name: Release module

# Shown in the runs list instead of the workflow name, so each run says which
# module it released. The version is not known at dispatch time (it is read
# from <module>/version.go); the run's summary reports the tags pushed.
run-name: Release ${{ inputs.module }}${{ inputs.ref && format(' @ {0}', inputs.ref) || '' }}

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release (crs/v4, lts/v4 and plugins also tag their tests module)"
        required: true
        type: choice
        options:
          - crs/v4
          - lts/v4
          - coraza/v3
          - plugins
      ref:
        description: "Commit SHA to tag (must be on main). Leave empty to tag the tip of main."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.x

      - name: Cut release tag
        env:
          MODULE: ${{ inputs.module }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          set -o pipefail
          go run mage.go tag "$MODULE" 2>&1 | tee "$RUNNER_TEMP/tag.log"

      - name: Summarize release
        if: always()
        env:
          MODULE: ${{ inputs.module }}
          JOB_STATUS: ${{ job.status }}
        run: |
          sha=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          log="$RUNNER_TEMP/tag.log"
          if [ "$JOB_STATUS" = "success" ]; then
            tags=$(sed -n 's/^>>> tagging //p' "$log")
            echo "::notice title=Released $MODULE::$(echo "$tags" | paste -sd ' ' -) at $sha"
            {
              echo "### Released \`$MODULE\` at \`$sha\`"
              echo
              for tag in $tags; do
                echo "- [\`$tag\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$tag)"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            reason=$(grep -m1 '^Error: ' "$log" 2>/dev/null | sed 's/^Error: //')
            reason=${reason:-see the job log}
            echo "::error title=Release of $MODULE failed::$reason (commit $sha)"
            {
              echo "### Release of \`$MODULE\` at \`$sha\` failed"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
