name: Release module

# The version is read from version.go inside the job, so it cannot be part of
# the run name; the run summary reports it.
run-name: Release ${{ inputs.module }}${{ inputs.ref && format(' @ {0}', inputs.ref) || '' }}

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release (crs/v4, lts/v4 and plugins also tag their tests module)"
        required: true
        type: choice
        options:
          - crs/v4
          - lts/v4
          - coraza/v3
          - plugins
      ref:
        description: "Commit SHA to tag (must be on main). Leave empty to tag the tip of main."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.x

      - name: Cut release tag
        env:
          MODULE: ${{ inputs.module }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          go run mage.go tag "$MODULE"
          echo "Released \`$MODULE\` $(sed -n 's/^const Version = "\(.*\)"/\1/p' "$MODULE/version.go")" >> "$GITHUB_STEP_SUMMARY"
