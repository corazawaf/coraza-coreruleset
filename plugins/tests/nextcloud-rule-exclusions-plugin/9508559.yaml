---
meta:
  author: "Esad Cetiner"
  description: "Nextcloud Office: Loading font file for Collabora Admin panel"
rule_id: 9508559
tests:
  - test_id: 1
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS test agent
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          port: 80
          method: POST
          uri: /configure_reflection
          data: |-
            { "endpoints": [{"method": "GET", "url": "/browser/123/admin/font/Montserrat-Regular.ttf"}], "body": "#{PP\x81I\" }
          version: HTTP/1.1

      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS test agent
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: /browser/123/admin/font/Montserrat-Regular.ttf
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [956110]

      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS test agent
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          port: 80
          method: PUT
          uri: /reset
          version: HTTP/1.1
